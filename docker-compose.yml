services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
      POSTGRES_DB: tandem
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles: ["full"]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://tandem:tandem@postgres:5432/tandem
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
      SHARE_SECRET: ${SHARE_SECRET:-dev-secret-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Chaos testing: put a controllable network between clients and the server.
  #   docker compose --profile chaos up -d
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["chaos"]
    command: ["-host", "0.0.0.0", "-config", "/etc/toxiproxy/proxy.json"]
    volumes:
      - ./apps/server/chaos/proxy.json:/etc/toxiproxy/proxy.json:ro
    ports:
      - "8474:8474"
      - "8666:8666"

volumes:
  pgdata:
