name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres redis
      # Postgres-backed persistence, Redis fan-out, and crash recovery
      # (SIGKILL a real server process and prove no acked op is lost)
      - run: pnpm --filter @tandem/server test
        env:
          TEST_DATABASE_URL: postgres://tandem:tandem@localhost:5434/tandem
          TEST_REDIS_URL: redis://localhost:6379
      - if: always()
        run: docker compose down -v
